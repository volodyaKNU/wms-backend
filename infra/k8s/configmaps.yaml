apiVersion: v1
kind: ConfigMap
metadata:
  name: wms-config
  namespace: wms
data:
  POSTGRES_DB: wms
  POSTGRES_USER: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wms-db-init
  namespace: wms
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS products (
      id SERIAL PRIMARY KEY,
      sku VARCHAR(64) NOT NULL UNIQUE,
      name VARCHAR(255) NOT NULL,
      unit VARCHAR(32) NOT NULL,
      quantity INTEGER NOT NULL DEFAULT 0 CHECK (quantity >= 0),
      min_quantity INTEGER NOT NULL DEFAULT 0 CHECK (min_quantity >= 0)
    );

    CREATE TABLE IF NOT EXISTS movements (
      id SERIAL PRIMARY KEY,
      product_id INTEGER NOT NULL REFERENCES products(id) ON DELETE CASCADE,
      type VARCHAR(16) NOT NULL CHECK (type IN ('income', 'writeoff')),
      quantity INTEGER NOT NULL CHECK (quantity > 0),
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_products_sku ON products(sku);
    CREATE INDEX IF NOT EXISTS idx_movements_product_id ON movements(product_id);
    CREATE INDEX IF NOT EXISTS idx_movements_created_at ON movements(created_at DESC);
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wms-frontend-nginx
  namespace: wms
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://wms-backend-service:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
