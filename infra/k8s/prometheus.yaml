apiVersion: v1
kind: ConfigMap
metadata:
  name: wms-prometheus-config
  namespace: wms
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: wms-backend
        metrics_path: /metrics
        static_configs:
          - targets:
              - wms-backend-service:4000
---
apiVersion: v1
kind: Service
metadata:
  name: wms-prometheus-service
  namespace: wms
spec:
  type: NodePort
  selector:
    app: wms-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wms-prometheus
  namespace: wms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wms-prometheus
  template:
    metadata:
      labels:
        app: wms-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: wms-prometheus-config
        - name: data
          emptyDir: {}
